name: Nightly Fuzz
"on":
  schedule:
    - cron: '0 2 * * *'  # 2am UTC nightly
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Run fuzz tests (extended)
        run: |
          pytest tests/security/fuzz_*.py tests/security/test_security_hardening.py \
            -v --hypothesis-seed=random \
            --tb=short
        env:
          HYPOTHESIS_PROFILE: thorough
